spring.application.name=savecms
# Aiven MySQL connection; override DB_URL if the service details change.
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-33a25e29-akul2200.c.aivencloud.com:19632/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Backend API port; the frontend on port 3000 proxies /api requests here.
server.port=${SERVER_PORT:8080}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.bootstrap-admin.full-name=${ADMIN_BOOTSTRAP_FULL_NAME:}
app.bootstrap-admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap-admin.phone=${ADMIN_BOOTSTRAP_PHONE:}
app.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
